services:
  - type: web
    name: kitobxon-tavsiya-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kitobxon-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kitobxon-redis
          property: connectionString
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_USERNAME
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: APP_NAME
        value: Kitobxon Tavsiya Bot
      - key: LOG_LEVEL
        value: INFO

  - type: keyvalue
    name: kitobxon-redis
    region: oregon
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render web service
    persistenceMode: off

databases:
  - name: kitobxon-postgres
    region: oregon
    plan: free
